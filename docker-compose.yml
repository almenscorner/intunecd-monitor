version: "3.8"

services:

  db:
    image: postgres:16-alpine
    container_name: intunecd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-intunecd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intunecd-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./
      dockerfile: Dockerfile
      target: web
    container_name: intunecd
    restart: unless-stopped
    entrypoint: ./server-entrypoint.sh
    expose:
      - 8080
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./
      dockerfile: Dockerfile-worker
      target: worker
    container_name: intunecd-worker
    restart: unless-stopped
    entrypoint: ./worker-entrypoint.sh
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./
      dockerfile: Dockerfile-beat
      target: beat
    container_name: intunecd-beat
    restart: unless-stopped
    entrypoint: ./beat-entrypoint.sh
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build: ./nginx
    container_name: nginx
    restart: unless-stopped
    command: ["/bin/sh", "-c", "envsubst < /etc/nginx/conf.d/nginx.conf.template > /etc/nginx/conf.d/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
