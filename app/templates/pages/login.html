<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — IntuneCD Monitor</title>
  <link rel="icon" type="image/png" href="/static/icon-72x72.png" />
  {% include 'include/stylesheets.html' %}
</head>

<body class="bg-zinc-950 min-h-screen flex items-center justify-center px-4" style="background-image: radial-gradient(ellipse 100% 70% at 50% -10%, rgba(99,102,241,0.18) 0%, transparent 60%), radial-gradient(ellipse 50% 50% at 85% 90%, rgba(139,92,246,0.12) 0%, transparent 50%), radial-gradient(ellipse 40% 40% at 10% 80%, rgba(56,189,248,0.06) 0%, transparent 50%);">

  <!-- dot grid -->
  <div class="fixed inset-0 pointer-events-none select-none" aria-hidden="true"
       style="background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 28px 28px;"></div>

  <div class="relative w-full max-w-sm" style="animation: fade-up 0.4s cubic-bezier(0.22,1,0.36,1) both;">

    <!-- Card -->
    <div class="relative">
      <div class="absolute -inset-4 bg-gradient-to-tr from-indigo-600/25 via-violet-500/15 to-sky-600/15 rounded-[2.5rem] blur-3xl pointer-events-none animate-pulse" style="animation-duration: 4s;"></div>
      <div class="relative bg-zinc-900/90 backdrop-blur-sm border border-zinc-800/60 rounded-2xl overflow-hidden shadow-2xl shadow-black/60">

        <!-- Header -->
        <div class="relative bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-700 px-8 py-8 text-center overflow-hidden">
        <div class="absolute inset-0 opacity-[0.07]" style="background-image: radial-gradient(rgba(255,255,255,0.8) 1px, transparent 1px); background-size: 20px 20px;"></div>
        <span class="relative material-icons-round text-white text-4xl mb-2 block drop-shadow-lg">bolt</span>
        {% if company_name %}
        <h1 class="text-white font-bold text-xl">{{ company_name }}</h1>
        <p class="text-indigo-200 text-sm mt-1">IntuneCD Monitor</p>
        {% else %}
        <h1 class="text-white font-bold text-xl">IntuneCD Monitor</h1>
        {% endif %}

        <!-- Social links -->
        <div class="flex items-center justify-center gap-4 mt-4">
          <a href="https://github.com/almenscorner/intunecd" target="_blank"
             class="text-indigo-200 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </a>
          <a href="https://twitter.com/intunecd" target="_blank"
             class="text-indigo-200 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <a href="https://www.linkedin.com/company/intunecd" target="_blank"
             class="text-indigo-200 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Body -->
      <div class="px-8 py-8">
        <p class="text-zinc-400 text-sm text-center mb-6">Sign in with your Entra ID account to continue</p>
        <a href="{{ auth_url }}"
           class="flex items-center justify-center gap-2 w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-medium py-2.5 rounded-lg transition-all duration-200 text-sm shadow-lg shadow-indigo-900/40 hover:shadow-indigo-800/50 active:scale-[0.98]">
          <span class="material-icons-round text-base">login</span>
          Sign in with Microsoft
        </a>
      </div>

      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-zinc-600 text-xs mt-6">
      made with ♥ by <a href="https://linktr.ee/almenscorner" class="text-zinc-500 hover:text-zinc-300" target="_blank">almenscorner</a>
      &mdash; v{{ app_version }}
    </p>

  </div>

</body>
</html>
