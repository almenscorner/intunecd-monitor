<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IntuneCD Monitor{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-72x72.png') }}" />
  {% include 'include/stylesheets.html' %}
</head>

<body class="bg-zinc-950 text-zinc-100 h-screen flex overflow-hidden">

  <!-- Sidebar -->
  {% include 'include/sidebar.html' %}

  <!-- Main area -->
  <div class="flex-1 flex flex-col overflow-hidden ml-64">

    <!-- Top navbar -->
    {% include 'include/navbar.html' %}

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </main>

  </div>

  {% include 'include/scripts.html' %}
  {% block javascripts %}{% endblock %}

</body>
</html>
