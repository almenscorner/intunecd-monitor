<div id="feeds" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">

  <!-- Update feed -->
  <div>
    <h2 class="text-sm font-semibold text-zinc-300 mb-3">Update feed</h2>
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
      <div class="p-3 border-b border-zinc-800">
        <input id="updateSearch" type="text" placeholder="Search…"
               onclick="attachTableListener('#updateSearch', '#updateTable')"
               class="input w-full text-sm" />
      </div>
      <div class="overflow-y-auto" style="max-height: 480px;">
        <table class="w-full text-sm">
          <tbody id="updateTable" class="divide-y divide-zinc-800">
            {% for item in data.update_feed %}
            <tr class="hover:bg-zinc-800/50 transition-colors">
              <td class="px-4 py-2.5">
                {% set icon, color = get_icon_and_color(item) %}
                <div class="flex items-center gap-3">
                  <span class="material-icons-round text-base {{ color }}">{{ icon }}</span>
                  <span class="text-zinc-300 text-xs">{{ item }}</span>
                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Backup feed -->
  <div>
    <h2 class="text-sm font-semibold text-zinc-300 mb-3">Backup feed</h2>
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
      <div class="p-3 border-b border-zinc-800">
        <input id="backupSearch" type="text" placeholder="Search…"
               onclick="attachTableListener('#backupSearch', '#backupTable')"
               class="input w-full text-sm" />
      </div>
      <div class="overflow-y-auto" style="max-height: 480px;">
        <table class="w-full text-sm">
          <tbody id="backupTable" class="divide-y divide-zinc-800">
            {% for item in data.backup_feed %}
            <tr class="hover:bg-zinc-800/50 transition-colors">
              <td class="px-4 py-2.5">
                {% set icon, color = get_icon_and_color(item, "backup") %}
                <div class="flex items-center gap-3">
                  <span class="material-icons-round text-base {{ color }}">{{ icon }}</span>
                  <span class="text-zinc-300 text-xs">{{ item }}</span>
                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
